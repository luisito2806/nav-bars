<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botones HTML</title>
    <link rel="stylesheet" href="ventana.css">
</head>
<body>

    <!-- Los 5 botones principales -->
    <div class="contenedor-botones">
        <button class="btn1">Botón 1</button>
        <button class="btn2">Botón 2</button>
        <button class="btn3">Botón 3</button>
        <button class="btn4">Botón 4</button>
        <button class="btn5">Botón 5</button>
    </div>

    <div id="ventana1" class="ventana not-show">
        <div class="contenido">
            <h2>Cuervos</h2>
            <p>Benito el zombie.</p>
            <button class="btn-cerrar1">Cerrar</button>
        </div>
    </div>

    <div id="ventana2" class="ventana not-show">
        <div class="contenido">
            <h2>Chava iglesias</h2>
            <p>Cuervos cuervos.</p>
            <button class="btn-cerrar2">Cerrar</button>
        </div>
    </div>

    <div id="ventana3" class="ventana not-show">
        <div class="contenido">
            <h2>Fortnite</h2>
            <p>Temporada X</p>
            <button class="btn-cerrar3">Cerrar</button>
        </div>
    </div>

    <div id="ventana4" class="ventana not-show">
        <div class="contenido">
            <h2>Colombia</h2>
            <p>Agua Ardiente</p>
            <button class="btn-cerrar4">Cerrar</button>
        </div>
    </div>

    <div id="ventana5" class="ventana not-show">
        <div class="contenido">
            <h2>A la bio</h2>
            <p>A la bao a la bimbomba</p>
            <button class="btn-cerrar5">Cerrar</button>
        </div>
    </div>

    <script>
        // 1.botones de abrir
        const btn1 = document.querySelector('.btn1');
        const btn2 = document.querySelector('.btn2');
        const btn3 = document.querySelector('.btn3');
        const btn4 = document.querySelector('.btn4');
        const btn5 = document.querySelector('.btn5');

        // 2. ventanas
        const ventana1 = document.querySelector('#ventana1');
        const ventana2 = document.querySelector('#ventana2');
        const ventana3 = document.querySelector('#ventana3');
        const ventana4 = document.querySelector('#ventana4');
        const ventana5 = document.querySelector('#ventana5');

        // 3. botones de cerrar
        const cerrar1 = document.querySelector('.btn-cerrar1');
        const cerrar2 = document.querySelector('.btn-cerrar2');
        const cerrar3 = document.querySelector('.btn-cerrar3');
        const cerrar4 = document.querySelector('.btn-cerrar4');
        const cerrar5 = document.querySelector('.btn-cerrar5');

        // ABRIR ventanas
        btn1.addEventListener('click', function() { ventana1.classList.remove('not-show'); });
        btn2.addEventListener('click', function() { ventana2.classList.remove('not-show'); });
        btn3.addEventListener('click', function() { ventana3.classList.remove('not-show'); });
        btn4.addEventListener('click', function() { ventana4.classList.remove('not-show'); });
        btn5.addEventListener('click', function() { ventana5.classList.remove('not-show'); });

        // CERRAR ventanas
        cerrar1.addEventListener('click', function() { ventana1.classList.add('not-show'); });
        cerrar2.addEventListener('click', function() { ventana2.classList.add('not-show'); });
        cerrar3.addEventListener('click', function() { ventana3.classList.add('not-show'); });
        cerrar4.addEventListener('click', function() { ventana4.classList.add('not-show'); });
        cerrar5.addEventListener('click', function() { ventana5.classList.add('not-show'); });
    </script>

</body>
</html>
